<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>NDS Performance</title>
<style>
html,body{margin:0;background:#000;color:#def2eb;font:13px system-ui;width:100%;height:100%;overflow:hidden}
/* Lock the emulator to the DS aspect so stylus coordinates map exactly (layout() updates --ar). */
#game{position:absolute;inset:0;margin:auto;width:min(100vw,calc(100vh * var(--ar,2.6667)));height:min(100vh,calc(100vw / var(--ar,2.6667)))}
#status{position:fixed;bottom:6px;left:6px;right:6px;z-index:20;background:#202020;padding:6px;overflow-wrap:anywhere}
#status[hidden]{display:none}
#hud{position:fixed;top:4px;left:4px;z-index:15;background:rgba(0,0,0,.72);color:#9ff5c8;padding:3px 6px;font:11px ui-monospace,Menlo,monospace;pointer-events:none}
#hud[hidden]{display:none}
#cursor{position:fixed;z-index:16;width:9px;height:9px;margin:-6px 0 0 -6px;border:2px solid #9ff5c8;border-radius:50%;pointer-events:none;box-shadow:0 0 0 1px #000}
#cursor[hidden]{display:none}
.rom-gate{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#101919}
.rom-gate[hidden]{display:none}
.rom-gate label{display:flex;flex-direction:column;gap:10px;max-width:340px;padding:16px}
.rom-gate small{color:#7fa596;line-height:1.4}
#rom-status{font-size:12px;color:#a9c8bd}
.ejs_menu_bar,.ejs_context_menu,.ejs_virtualGamepad_parent{display:none!important}
